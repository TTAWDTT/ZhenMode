comparison:
  scope: global_shared_grid
  limitations:
  - 当前adapter要求相同经纬度网格，无隐含重网格。
  - 预设来源为历史生产脚本；缺少原始缓存预期SHA256，运行时测量并保留，历史成绩不重新授予。
  - 分离线性自由面FD与MOM6的垂向/离散方案及实际输入差异，不能直接授予工业级资格。
