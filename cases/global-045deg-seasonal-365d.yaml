schema_version: 1
kind: case
id: global-045deg-seasonal-365d
name_zh: 全球0.45度年度空气强迫365天
description: 复用已有全球FD物理问题与输入版本；预设保留原脚本参数。不是已在当前源码重新运行的成绩。
domain:
  boundary: periodic_lon_closed_lat
  lat_max:
    value: 65
    unit: deg
  coriolis: rotating_earth
grid:
  kind: etopo
  resolution:
    value: 0.45
    unit: deg
  resolution_remap: area
  z_levels:
    value:
    - 0
    - -5
    - -15
    - -30
    - -50
    - -75
    - -100
    - -150
    - -200
    - -300
    - -500
    - -1000
    - -2000
    - -4000
    unit: m
duration:
  value: 31536000
  unit: s
output_interval:
  value: 864000
  unit: s
initial:
  kind: woa2023
forcing:
  kind: seasonal_ncep2023
  description: 重复360日季节风周期、30日月长；相应热通量/恢复按下方声明。
  options:
    seasonal_wind: true
    wind_year: 2023
    real_air_temp: true
data:
- role: bathymetry
  path: data/ETOPO_2022_v1_r3600x1800_surface.nc.npz
  version: ETOPO2022 v1 0.1-degree; local extracted twin
  sha256: null
  status: pending
  source: NOAA ETOPO2022; see docs/input_sources_zh.md
- role: temperature
  path: data/woa/woa23_decav_t00_01.nc.npz
