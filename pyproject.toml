[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zhenmode"
version = "0.1.0"
description = "Global finite-difference ocean model solving the hydrostatic primitive equations"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "netCDF4>=1.6",
    "jax>=0.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "setuptools>=68.0",
]

[project.scripts]
ocean-solver = "zhenmode.model.runtime.run:main"
zhenmode = "zhenmode.cli:main"

# Install the product package: model, execution, baselines and evaluation.
[tool.setuptools]
package-dir = { "" = "src", "scripts" = "scripts" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["zhenmode*"]

[tool.setuptools.package-data]
"zhenmode.baselines.oceananigans" = ["*.json", "*.jl"]
"zhenmode.baselines.mom6" = ["*.json", "cases/*.json", "README.md"]
"zhenmode.coupling" = ["sis2_bridge.f90"]

[tool.setuptools.cmdclass]
build_py = "scripts.build_distribution.CleanBuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Exclude generated outputs explicitly so lint scope is consistent across clones.
respect-gitignore = false
extend-exclude = [
    "build",        # generated wheel build tree, never authoritative source
    "results",       # local run outputs
    "outputs",       # local receipts, downloaded references and tool caches
    "data/**", "logs/**", "checkpoints/**",   # local run I/O
    "dashboard",
    "research",       # local research workspace
    "scratch",        # local probes and legacy artifacts
    ".claude",        # local agent worktrees / session metadata
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # long lines are common in the operator/derivation comments
]

[tool.ruff.lint.per-file-ignores]
# Test support imports use the installed package and repository fixtures.
"tests/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ['zhenmode', 'tests', 'scripts']
