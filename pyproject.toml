[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-solver"
version = "0.1.0"
description = "Global finite-difference ocean model solving the hydrostatic primitive equations"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "netCDF4>=1.6",
    "jax>=0.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "setuptools>=68.0",
]

[project.scripts]
ocean-solver = "ocean_solver.runtime.entry:main"
zhenmode = "ocean_solver.cli:main"

# Production uses canonical package imports; research is separately installed.
[tool.setuptools]
package-dir = { "" = "src", "scripts" = "scripts" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocean_solver*"]

[tool.setuptools.cmdclass]
build_py = "scripts.build_distribution.CleanBuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Exclude generated outputs explicitly so lint scope is consistent across clones.
respect-gitignore = false
extend-exclude = [
    "build",        # generated wheel build tree, never authoritative source
    "results",       # local run outputs
    "data/**", "logs/**", "checkpoints/**",   # local run I/O
    "dashboard/node_modules",
    "research",       # separately installed research implementations
    "scratch",        # local probes and legacy artifacts
    ".claude",        # local agent worktrees / session metadata
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # long lines are common in the operator/derivation comments
]

[tool.ruff.lint.per-file-ignores]
# Test support imports use the installed package and repository fixtures.
"tests/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ['ocean_solver', 'zhenmode_research', 'tests', 'research', 'scripts', 'dashboard']
