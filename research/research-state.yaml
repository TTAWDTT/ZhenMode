# Research State — Central Project Tracking
# Updated by the agent after each experiment and reflection.

project:
  title: "Survey of widely used high-fidelity ocean general circulation models"
  question: "What numerical, physical, and software choices make the most widely used ocean models robust, scalable, and scientifically credible, and which should ocean_solver adopt next?"
  status: active
  started: "2026-09-21"
  domain: "ocean modeling / geophysical fluid dynamics"

literature:
  key_papers: []
  open_problems:
    - "How do mature OGCMs enforce conservation and stability at coarse/fine boundaries?"
    - "Which spatial discretizations balance accuracy, scalability, and maintainability?"
    - "How do production models organize subgrid closures and boundary conditions?"
  evidence_gaps:
    - "Need quantitative side-by-side benchmark numbers on the same hardware." 
    - "Need a focused prototype to test the full 3D FCT transport idea in ocean_solver."

hypotheses:
  - id: H1
    statement: "Mature OGCM robustness comes more from conservative finite-volume/finite-element operators, split-explicit time stepping, and disciplined boundary masks than from exotic high-order stencils."
    status: supported
    motivation: "Ocean_solver has already found centered-flux and mask-boundary issues; mature models likely encode this as standard practice."
    priority: high
  - id: H2
    statement: "The dominant production ocean models use a small set of proven subgrid closures (GM/Redi, KPP, Smagorinsky/biharmonic) rather than model-specific ad hoc schemes."
    status: supported
    motivation: "Can identify closures ocean_solver should port next."
    priority: high
  - id: H3
    statement: "Modern scalability is increasingly achieved through MPI domain decomposition with optional GPU/accelerator ports rather than monolithic JAX-style whole-step compilation."
    status: partially_supported
    motivation: "Could guide ocean_solver's path from single-GPU to distributed runs."
    priority: high
  - id: H4
    statement: "The most transferable next improvements are conservative horizontal transport, robust vertical coordinate treatment, and standardized diagnostics, not immediate neural-PDE extensions."
    status: supported
    motivation: "Aligns with user's desire for reliable numerical ocean model rather than neural operator."
    priority: high
  - id: H5
    statement: "Spatially varying atmospheric forcing, rather than scalar surface-restoring strength or transport tuning, is a first-order control on global SST climate skill."
    status: supported
    motivation: "Annual NCEP 2m air temperature turned A2 from fail (2.115 C) to pass (1.883 C) at fixed physics."
    priority: high

experiments:
  proxy_metric: "Global annual A2 SST pattern RMSE (C)"
  baseline_value: 2.115
  best_value: 1.883
  total_runs: 7
  trajectory:
    - run: "lambda1 FCT/TVD baseline"
      value: 2.115
    - run: "lambda0.25"
      value: 3.387
    - run: "lambda0.5"
      value: 2.482
    - run: "lambda2.0"
      value: 2.031
    - run: "annual NCEP 2m air forcing"
      value: 1.883
    - run: "annual NCEP 2m air repeat"
      value: 1.886
    - run: "monthly NCEP 2m air forcing"
      value: 1.990

outer_loop:
  cycle: 9
  last_direction: "monthly atmospheric forcing decision"
  last_reflection: "Attribution showed closed walls are not dominant; deep ocean is 63% of A2 SSE and a zonally uniform bulk target explains ~69% of error variance. Scalar lambda changes do not meet the 5% A2 improvement gate. Opt-in annual-mean NCEP 2m air forcing improved A2 from 2.115 to 1.883 C and passed both A1 and A2; Monthly forcing was implemented and passes (A2 1.990 C) but does not beat annual-mean real air (1.886 C), so annual real air remains the preferred simple baseline. Next lever is coastal mask/mixing, not more scalar forcing tuning."

workspace:
