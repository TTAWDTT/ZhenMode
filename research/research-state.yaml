outer_loop:
  cycle: 17
  last_direction: "GM transport and mixed-layer closure diagnostics"
  last_reflection: "The original GM strength is too large for the 65N lambda80 candidate: stronger GM cools the North Atlantic and worsens A2. GM500 is the preferred non-zero setting. Localized convective adjustment then improves global A2 from 1.449 to 1.410 C and North Atlantic RMSE from 1.417 to 1.306 C; the result is reproduced. Treat this combined configuration as the preferred diagnostic candidate, still opt-in. Next use 3D heat-tendency decomposition to attribute the remaining error among advection, convection, GM, diffusion and surface flux."

