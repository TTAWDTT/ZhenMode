# Research State — Central Project Tracking
# Updated by the agent after each experiment and reflection.

project:
  title: "Survey of widely used high-fidelity ocean general circulation models"
  question: "What numerical, physical, and software choices make the most widely used ocean models robust, scalable, and scientifically credible, and which should ocean_solver adopt next?"
  status: active
  started: "2026-09-21"
  domain: "ocean modeling / geophysical fluid dynamics"

literature:
  key_papers: []
  open_problems:
    - "How do mature OGCMs enforce conservation and stability at coarse/fine boundaries?"
    - "Which spatial discretizations balance accuracy, scalability, and maintainability?"
    - "How do production models organize subgrid closures and boundary conditions?"
  evidence_gaps:
    - "Need quantitative side-by-side benchmark numbers on the same hardware." 
    - "Need a focused prototype to test the full 3D FCT transport idea in ocean_solver."

hypotheses:
  - id: H1
    statement: "Mature OGCM robustness comes more from conservative finite-volume/finite-element operators, split-explicit time stepping, and disciplined boundary masks than from exotic high-order stencils."
    status: supported
    motivation: "Ocean_solver has already found centered-flux and mask-boundary issues; mature models likely encode this as standard practice."
    priority: high
  - id: H2
    statement: "The dominant production ocean models use a small set of proven subgrid closures (GM/Redi, KPP, Smagorinsky/biharmonic) rather than model-specific ad hoc schemes."
    status: supported
    motivation: "Can identify closures ocean_solver should port next."
    priority: high
  - id: H3
    statement: "Modern scalability is increasingly achieved through MPI domain decomposition with optional GPU/accelerator ports rather than monolithic JAX-style whole-step compilation."
    status: partially_supported
    motivation: "Could guide ocean_solver's path from single-GPU to distributed runs."
    priority: high
  - id: H4
    statement: "The most transferable next improvements are conservative horizontal transport, robust vertical coordinate treatment, and standardized diagnostics, not immediate neural-PDE extensions."
    status: supported
    motivation: "Aligns with user's desire for reliable numerical ocean model rather than neural operator."
    priority: high
  - id: H5
    statement: "Spatially varying atmospheric forcing, rather than scalar surface-restoring strength or transport tuning, is a first-order control on global SST climate skill."
    status: supported
    motivation: "Annual NCEP 2m air temperature turned A2 from fail (2.115 C) to pass (1.883 C) at fixed physics."
    priority: high

  - id: H6
    statement: "The closed 60N wall contributes materially to the North Atlantic cold bias, so poleward domain extension is a stronger diagnostic lever than widening the polar cap."
    status: supported
    motivation: "Two 365d 65N runs reduced regional A2 RMSE by ~22.6% and cold bias by ~0.34 C; a wider cap worsened the same region."
    priority: high

  - id: H7
    statement: "Surface bulk heat-exchange strength is a leading scalar control on the 65N North Atlantic cold bias."
    status: supported
    motivation: "365d runs show a monotonic response: lambda20 gives A2 2.362 C, lambda40 1.773 C, and lambda80 1.530 C."
    priority: high

  - id: H8
    statement: "The original GM strength is excessive for the 65N lambda80 North Atlantic diagnostic."
    status: supported
    motivation: "GM0, GM500, GM1000 and GM3000 give A2 RMSE 1.419, 1.449, 1.530 and 2.089 C respectively."
    priority: high

  - id: H9
    statement: "Column-wide convective adjustment over-mixes the 65N candidate; per-interface localization is a structural improvement."
    status: supported
    motivation: "Localized convection improves global A2 from 1.449 to 1.410 C and regional RMSE from 1.417 to 1.306 C, with a reproduced repeat."
    priority: high

  - id: H10
    statement: "Horizontal viscosity is not the main limiting factor for the 65N North Atlantic cold bias."
    status: supported
    motivation: "Lower nu_h runs were stable but slightly worsened regional RMSE."
    priority: medium

  - id: H11
    statement: "SSS restoring gives only a minor improvement and is not the main structural fix."
    status: supported
    motivation: "30d and 90d restoring both improved global A2 by about 0.19% and regional RMSE by under 0.6%."
    priority: low

  - id: H12
    statement: "Horizontal resolution is a controlling factor for the remaining North Atlantic cold bias."
    status: supported
    motivation: "A 0.8-degree run improved global A2 RMSE by 3.6% and regional RMSE by 4.7% over the 1-degree candidate."
    priority: high

  - id: H13
    statement: "Horizontal resolution reaches diminishing returns near 0.45 degree for this prototype; further refinement is not the next dominant lever."
    status: supported
    motivation: "At dt=1800s and nu_h=2e6, 365d global A2 improves from 1.171 C at 0.50 to 1.149 C at 0.45, but 0.40 gives only 1.142 C and 0.35 gives 1.114 C while near-wall bias worsens from -0.917 to -0.965 C and runtime roughly doubles."
    priority: high

  - id: H14
    statement: "Simple enhanced local diffusion is not the missing coastal closure; the remaining lever is boundary-current/lateral heat transport representation."
    status: supported
    motivation: "Coastal vertical diffusivity at 1e-5/1e-4 and horizontal diffusivity at 1e3/1e4 all failed to improve the near-wall band, while hard coastal restore exposes a strong boundary-value/mixed-layer control."
    priority: high

