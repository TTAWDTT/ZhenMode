name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: "Run the full suite and MMS after human review"
        type: boolean
        required: true
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # JAX's PyPI wheel is CPU-only on Linux, which is all the suite needs.
      - run: pip install -e ".[dev]"
      # Research is a separate distribution, installed only for its retained tests.
      - run: pip install -e ./research
      # No real ETOPO/WOA/wind data in CI, so generate the synthetic
      # stand-in first: without it the grid/bathymetry tests skip
      # themselves (tests/test_resolution.py::requires_bathy).
      - run: python scripts/make_synthetic_bathymetry.py
      - run: python -m pytest tests/ -q
      # Self-contained manufactured-solution check on the FD operators; no
      # data required. Fails the build if the operators lose 2nd order.
      - run: python -m ocean_solver mms
